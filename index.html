<title>City &amp; Suburban Previews</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#09263A;--mute:#5B6B7A;--line:#D9E0E8;--paper:#F4F6F9}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Geist,system-ui,sans-serif;color:#22303C;background:#fff;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:0 24px}
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;justify-content:space-between;align-items:center;padding:18px 24px}
header .cs{height:44px} .by{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mute)} .by img{height:24px}
main{padding:64px 0 80px}
h1{font-size:clamp(32px,5vw,48px);color:var(--navy);letter-spacing:-.03em;line-height:1.05}
p.lede{margin-top:14px;font-size:18px;color:var(--mute);max-width:56ch;line-height:1.5}
.card{display:block;margin-top:40px;border:1px solid var(--line);border-radius:16px;padding:28px 30px;text-decoration:none;color:inherit;background:var(--paper);transition:border-color .15s}
.card:hover,.card:focus-visible{border-color:var(--navy)}
.card:focus-visible{outline:3px solid #126CD3;outline-offset:3px}
.card small{font-size:13px;font-weight:600;color:var(--mute)}
.card h2{margin-top:6px;font-size:24px;color:var(--navy);letter-spacing:-.02em}
.card p{margin-top:8px;font-size:16px;line-height:1.5;max-width:60ch}
.card span{display:inline-block;margin-top:16px;font-weight:600;color:var(--navy)}
@media (max-width:600px){header .cs{height:34px} .by span{display:none}}
</style></head><body>
